name: Bug report
description: Something aisomnia did or did not do on your Mac
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: aisomnia version
      description: Output of `aisomnia version`
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      description: Output of `sw_vers -productVersion` and the model (for example MacBook Pro M4)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and what the Mac did. Paste the output of `aisomnia status` if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: profile
    attributes:
      label: Profile
      description: Output of `aisomnia profile` if you changed it
      render: toml
