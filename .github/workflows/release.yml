name: Release

# Full release automation:
# 1. Runs after CI succeeds on main (or weekly, or by hand).
# 2. release-please reads the Conventional Commits since the last tag and opens or updates the
#    release pull request (next version + CHANGELOG.md).
# 3. With the repository variable AUTO_RELEASE = "true" the workflow starts CI on the release branch,
#    waits for the checks main requires, merges the pull request, and release-please creates the tag
#    and the GitHub release in the same run; otherwise merging the release pull request by hand does it.
# 4. GoReleaser builds darwin/arm64 + darwin/amd64, attaches archives and checksums to the release and
#    pushes the Homebrew formula to lidow/homebrew-tap with a deploy key (secret HOMEBREW_TAP_DEPLOY_KEY).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write        # dispatch CI on the release branch
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.first.outputs.release_created || steps.second.outputs.release_created }}
      tag_name: ${{ steps.first.outputs.tag_name || steps.second.outputs.tag_name }}
    steps:
      - id: first
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: merge
        if: vars.AUTO_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # release-please reports a release pull request only in the run that creates or updates it,
          # so look up the pending one directly.
          pr=$(gh pr list --state open --label "autorelease: pending" --json number,headRefName -q '.[0] | "\(.number) \(.headRefName)"')
          if [ -z "$pr" ]; then echo "no pending release pull request"; exit 0; fi
          set -- $pr
          PR=$1 BRANCH=$2
          # Bring the release branch up to date first: workflow_dispatch reads ci.yml from that branch,
          # and the checks must run against what main holds now.
          gh pr update-branch "$PR" --rebase || true
          sleep 5
          # main requires CI; a pull request opened with the workflow token gets none, so start it here.
          gh workflow run ci.yml --ref "$BRANCH"
          for _ in $(seq 1 60); do
            n=$(gh pr checks "$PR" --required --json name -q 'length' 2>/dev/null || echo 0)
            [ "${n:-0}" -ge 4 ] && break
            sleep 10
          done
          gh pr checks "$PR" --required --watch --fail-fast --interval 15
          gh pr merge "$PR" --squash --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"
      - id: second
        if: steps.merge.outputs.merged == 'true'
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Test before publishing
        run: go vet ./... && go test -count=1 ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          # Without the deploy key the release is still published; only the formula is skipped.
          args: release --clean ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY == '' && '--skip=homebrew' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
