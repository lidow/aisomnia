name: Weekly vulnerability scan

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - id: scan
        run: |
          set +e
          GOOS=darwin govulncheck ./... > report.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.txt
      - name: Open an issue when something is found
        if: steps.scan.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="govulncheck found a vulnerability ($(date -u +%F))"
          gh issue list --label security --state open --search "$title" --json number -q '.[0].number' | grep -q . && exit 0
          gh issue create --title "$title" --label security --body-file report.txt
