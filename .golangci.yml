version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gosec
    - revive
    - unconvert
    - unparam
    - nolintlint
  settings:
    errcheck:
      exclude-functions:
        # Terminal output: a failed write to stdout/stderr has nowhere better to be reported.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush
    gosec:
      excludes:
        - G204 # subprocess with variable arguments: every command is built from the profile on purpose
        - G702 # same, taint analysis: durations and kinds are validated before they reach caffeinate/sudo
        - G304 # file path from a variable: reading the profile the user names is the feature
        - G703 # same, taint analysis of that path
        - G301 # 0755 directories under ~/.config and ~/Library are intended
        - G306 # 0644 for plists and hold files is intended (logs are 0600)
    misspell:
      locale: US
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
